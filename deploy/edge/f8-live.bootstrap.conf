# f8-live — 13f.noeinsolutions.com (bootstrap vhost, HTTP only)
# Installed by deploy/edge-install.sh only while the certificate is being
# issued: it serves the ACME challenge and nothing else, then gets replaced by
# f8-live.conf.

server {
    listen 80;
    listen [::]:80;
    server_name 13f.noeinsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
