# f8-live — 13f.noeinsolutions.com, the LIVE 13F dashboard (not the demo,
# which is 13f.demos.noeinsolutions.com and lives in .deploy/).
#
# Installed by deploy/edge-install.sh as /opt/sites/_vhosts/f8-live.conf on the
# shared nginx edge. Do not edit it on the server: the script overwrites it.
#
# Unlike the container sites next to it, the upstream is the host's own systemd
# services: f8-web (Vite) listening on the Docker bridge 172.17.0.1:5173, which
# proxies /api to f8-api on 127.0.0.1:9002. Neither answers from the internet,
# so this vhost - and its password - is the only way in.

# HTTP — ACME challenge only, everything else redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name 13f.noeinsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 13f.noeinsolutions.com;

    ssl_certificate     /etc/letsencrypt/live/13f.noeinsolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13f.noeinsolutions.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The dashboard has no login of its own; this is the lock. The file sits
    # next to the vhosts (the only directory mounted into nginx that is not
    # Capsar's) and is written by `deploy/edge-install.sh --set-password`.
    auth_basic           "13F dashboard";
    auth_basic_user_file /etc/nginx/conf.d/sites/f8-live.htpasswd;

    # Deliberately no `limit_req` and no dotfile deny, unlike the site template:
    # Vite's dev server loads hundreds of modules on a first visit (the shared
    # 20 r/s zone would answer 503) and serves them from /node_modules/.vite/.

    location / {
        proxy_pass         http://host.docker.internal:5173;
        proxy_http_version 1.1;
        # Vite refuses Host headers it does not know ("Blocked request. This
        # host is not allowed"), and localhost is always allowed. The host
        # check that matters has already happened here, in server_name.
        proxy_set_header   Host              localhost:5173;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # Exports and the heavier analytics endpoints can take a while.
        proxy_read_timeout 300s;
    }
}
