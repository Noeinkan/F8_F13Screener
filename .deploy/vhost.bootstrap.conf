# 13f — 13f.demos.noeinsolutions.com (bootstrap vhost, HTTP only)
# Installed by site-deploy.sh *only* while the first certificate is being
# issued, then replaced by the real HTTPS vhost. Serves nothing but the ACME
# challenge, so the site is never reachable in cleartext.
server {
    listen 80;
    listen [::]:80;
    server_name 13f.demos.noeinsolutions.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
